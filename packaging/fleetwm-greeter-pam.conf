auth       required   pam_unix.so
# Unlocks the login keyring (gnome-keyring, the Secret Service that ssh keys, Chromium, git-credential-libsecret and others keep their secrets
# in) with the password typed at the login screen, so nothing asks for it again after login. The "-" skips a line whose module is not installed.
-auth       optional   pam_gnome_keyring.so
account    required   pam_unix.so
password   required   pam_unix.so
# Keeps the keyring's password in step with the login password when `passwd` changes it.
-password   optional   pam_gnome_keyring.so
session    required   pam_unix.so
session    optional   pam_systemd.so
session    optional   pam_limits.so
# Starts the keyring daemon for the session (after the session exists, so XDG_RUNTIME_DIR does); its control and ssh socket variables reach the
# session through the PAM environment (src/greeter/auth.cpp passes pam_getenvlist on).
-session    optional   pam_gnome_keyring.so auto_start
