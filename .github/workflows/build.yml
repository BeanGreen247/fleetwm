name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:26.04"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential meson ninja-build pkg-config git \
            libwlroots-0.18-dev wayland-protocols libwayland-dev \
            libinput-dev libdrm-dev libxkbcommon-dev libpixman-1-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libgtk-4-dev libgtk4-layer-shell-dev \
            libpipewire-0.3-dev \
            libpam0g-dev \
            libsystemd-dev \
            librsvg2-common

      - name: Configure
        run: meson setup build --buildtype=debug

      - name: Build
        run: ninja -C build
